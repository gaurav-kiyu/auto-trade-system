# Prometheus Configuration — OPB Trading System
# Scrapes the trading bot's metrics endpoint + standard node exporter

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "opb-trading-system"

rule_files:
  - "alerts.yml"

scrape_configs:
  # ── Trading Bot Metrics ────────────────────────────────────────────
  - job_name: "opb-trading"
    scrape_interval: 15s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:9090"]
        labels:
          service: "trading-engine"
          environment: "production"

  # ── System Metrics (Node Exporter) — requires host node-exporter ────
  - job_name: "node"
    scrape_interval: 30s
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          service: "system"
          environment: "production"
