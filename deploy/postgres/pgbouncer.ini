; PgBouncer configuration for OPB production deployment
;
; PgBouncer acts as a lightweight connection pooler between the
; PostgresConnectionPool (application side) and PostgreSQL server.
;
; Architecture:
;   OPB Bot → PostgresConnectionPool (app-level, min/max per process)
;     → PgBouncer (server-level, shared across processes)
;       → PostgreSQL (database server)
;
; This two-tier pooling allows:
; - Multiple OPB processes to share a small number of database connections
; - Connection limits far below PostgreSQL's max_connections
; - Transparent reconnect on server failover
;
; Auth: Uses md5 (compatible with PostgreSQL's md5 authentication).
;       Generate passwords with:
;         echo -n "passwordusername" | md5sum | awk '{print "md5" $1}'

[databases]
; Map all application databases to the PostgreSQL server
opb_trades      = host=postgres port=5432 dbname=opb_trades
opb_journal     = host=postgres port=5432 dbname=opb_journal
opb_ml          = host=postgres port=5432 dbname=opb_ml
opb_oi          = host=postgres port=5432 dbname=opb_oi
opb_signals     = host=postgres port=5432 dbname=opb_signals
opb_lineage     = host=postgres port=5432 dbname=opb_lineage
opb_events      = host=postgres port=5432 dbname=opb_events
opb_execution   = host=postgres port=5432 dbname=opb_execution
opb_features    = host=postgres port=5432 dbname=opb_features
opb_shadow      = host=postgres port=5432 dbname=opb_shadow
opb_strategy_perf = host=postgres port=5432 dbname=opb_strategy_perf
opb_strategy_ver  = host=postgres port=5432 dbname=opb_strategy_ver
opb_order_state = host=postgres port=5432 dbname=opb_order_state
opb_regime      = host=postgres port=5432 dbname=opb_regime
opb_fundamentals = host=postgres port=5432 dbname=opb_fundamentals
opb_replay      = host=postgres port=5432 dbname=opb_replay

[pgbouncer]
; ── Listen ─────────────────────────────────────────────────────────────────
listen_addr     = 0.0.0.0
listen_port     = 6432
auth_type       = md5
auth_file       = /etc/pgbouncer/userlist.txt

; ── Pool Settings ─────────────────────────────────────────────────────────
default_pool_size      = 20      ; Max client connections per database
max_client_conn        = 100     ; Total client connections across all databases
reserve_pool_size      = 5       ; Extra connections for when pool is exhausted
reserve_pool_timeout   = 3.0     ; Seconds before using reserve pool
pool_mode              = transaction

; ── Timeouts ──────────────────────────────────────────────────────────────
server_idle_timeout    = 600     ; Close server connections idle for 10 min
client_idle_timeout    = 0       ; Never close idle clients (let app manage)
query_timeout          = 30      ; Max query execution time (30 seconds)
query_wait_timeout     = 10      ; Max time a client waits for a connection
idle_transaction_timeout = 300   ; Close idle transactions after 5 min

; ── Connection Lifecycle ─────────────────────────────────────────────────
server_lifetime        = 3600     ; Reconnect after 1 hour
server_connect_timeout = 10       ; Max time to establish new server connection
server_login_retry     = 1        ; Retry failed logins after 1 second
client_login_timeout   = 60       ; Max time for client to complete auth

; ── TLS (Production Only) ────────────────────────────────────────────────
; client_tls_sslmode   = require
; client_tls_key_file  = /etc/pgbouncer/tls/server.key
; client_tls_cert_file = /etc/pgbouncer/tls/server.crt
; client_tls_ca_file   = /etc/pgbouncer/tls/ca.crt

; ── Logging ───────────────────────────────────────────────────────────────
log_connections       = 1
log_disconnections    = 1
log_pooler_errors     = 1
stats_period          = 60
verbose               = 0

; ── Admin ──────────────────────────────────────────────────────────────────
admin_users           = opb_admin
stats_users           = opb_monitor

; ── Timezone ──────────────────────────────────────────────────────────────
default_timezone      = Asia/Kolkata
