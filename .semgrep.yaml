# Semgrep Security Scanning Configuration — OPBuying Trading Platform
# ─────────────────────────────────────────────────────────────────────────────
# Usage:
#   semgrep --config=.semgrep.yaml --error
#   semgrep --config=.semgrep.yaml --json -o reports/semgrep-report.json
#
# Install: pip install semgrep
# ─────────────────────────────────────────────────────────────────────────────

rules:
  # ── Python Injection ──────────────────────────────────────────────────────
  - id: python-eval-use
    patterns:
      - pattern: eval($X)
      - pattern-not: eval("...")
    message: "Avoid 'eval()' — can lead to code injection. Use safer alternatives."
    severity: ERROR
    languages: [python]

  - id: python-exec-use
    patterns:
      - pattern: exec($X)
      - pattern-not: exec("...")
    message: "Avoid exec() — can lead to code injection."
    severity: ERROR
    languages: [python]

  - id: python-subprocess-shell-true
    pattern: subprocess.$FUNC(..., shell=True, ...)
    message: "shell=True is dangerous — use shell=False with argument list."
    severity: ERROR
    languages: [python]

  - id: python-request-without-timeout
    pattern: requests.$FUNC($URL, ...)
    message: "HTTP request without timeout — can hang indefinitely. Add timeout=30."
    severity: WARNING
    languages: [python]

  - id: python-pickle-use
    pattern: pickle.loads(...)
    message: "Pickle can execute arbitrary code — use JSON or a safe serialization format."
    severity: WARNING
    languages: [python]

  - id: python-dangerous-html-escape
    pattern: |
      $TEMPLATE = "${$X}"
      Markup($TEMPLATE)
    message: "Potential XSS — avoid raw Markup(). Use escape() or templates with auto-escaping."
    severity: WARNING
    languages: [python]

  # ── SQL Injection ─────────────────────────────────────────────────────────
  - id: python-sql-injection-format
    pattern: |
      f"...{$INPUT}..."
      ...
      cursor.execute(...)
    message: "SQL injection risk — use parameterized queries with placeholders (%s, ?) instead of f-strings."
    severity: ERROR
    languages: [python]

  - id: python-sql-injection-concatenation
    pattern: |
      "..." + $INPUT + "..."
      ...
      cursor.execute(...)
    message: "SQL injection risk — use parameterized queries."
    severity: ERROR
    languages: [python]

  - id: python-orm-mass-assignment
    pattern: |
      $MODEL(**$DICT)
      ...
      session.add($MODEL)
    message: "Mass assignment risk — whitelist allowed fields instead of passing entire dict."
    severity: WARNING
    languages: [python]

  # ── Secrets & Credentials ─────────────────────────────────────────────────
  - id: python-hardcoded-secret
    pattern-either:
      - pattern: |
          $SECRET = "..."
          ...
          $TOKEN = $SECRET
      - pattern: |
          API_KEY = "..."
      - pattern: |
          SECRET_KEY = "..."
    message: "Hardcoded secret/key — use environment variables or a vault."
    severity: ERROR
    languages: [python]

  - id: python-aws-key
    pattern-either:
      - pattern: AKIA[0-9A-Z]{16}
      - pattern: '"AKIA[0-9A-Z]{16}"'
    message: "AWS Access Key ID detected — remove from source code."
    severity: ERROR
    languages: [python, generic]

  - id: python-password-in-code
    pattern: |
      $VAR = "$PASS" ...
      password = $VAR
    message: "Password detected in source code — use environment variables."
    severity: ERROR
    languages: [python]

  - id: python-token-hardcoded
    pattern: |
      $TOKEN = "$VALUE"
    metavariable-pattern:
      metavariable: $VALUE
      regex: "[A-Za-z0-9_-]{20,}"
    message: "Potential token/credential hardcoded — use environment variables."
    severity: WARNING
    languages: [python]

  # ── Path Traversal ─────────────────────────────────────────────────────────
  - id: python-path-traversal-join
    pattern: |
      os.path.join("...", $USER_INPUT)
    message: "Path traversal risk — validate user input before joining paths."
    severity: WARNING
    languages: [python]

  - id: python-path-traversal-open
    pattern: |
      open(os.path.join($DIR, $FILENAME))
    message: "Potential path traversal — validate filename parameter."
    severity: WARNING
    languages: [python]

  # ── Cryptographic Issues ─────────────────────────────────────────────────
  - id: python-weak-crypto
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)
    message: "Weak cryptographic hash — use SHA-256 or stronger (hashlib.sha256)."
    severity: WARNING
    languages: [python]

  # ── Insecure Defaults ─────────────────────────────────────────────────────
  - id: python-debug-mode-prod
    pattern: |
      app.run(debug=True, ...)
    message: "Debug mode in production — set debug=False or use environment variable."
    severity: ERROR
    languages: [python]

  - id: python-exception-without-limit
    pattern: |
      except Exception as $E:
        ...
        return {"error": str($E)}
    message: "Leaking error details to client — log the error, return generic message."
    severity: WARNING
    languages: [python]

  # ── File Upload ──────────────────────────────────────────────────────────
  - id: python-unsafe-upload
    pattern: |
      file.save(os.path.join($UPLOAD_DIR, $FILENAME))
    message: "Potential unsafe file upload — validate file extension, size, and scan content."
    severity: WARNING
    languages: [python]

  # ── Logging ──────────────────────────────────────────────────────────────
  - id: python-sensitive-data-in-log
    pattern: |
      logger.$LEVEL(f"...password...")
    message: "Sensitive data (password) in log — redact before logging."
    severity: ERROR
    languages: [python]

  - id: python-sensitive-log-var
    pattern: |
      logger.$LEVEL(f"...{token}...")
    message: "Potential sensitive data in log — check what 'token' contains."
    severity: WARNING
    languages: [python]

  # ── FastAPI / Starlette Specific ──────────────────────────────────────────
  - id: fastapi-cors-any-origin
    pattern: |
      CORSMiddleware(allow_origins=["*"], ...)
    message: "CORS with allow_origins=['*'] — restrict to specific origins in production."
    severity: WARNING
    languages: [python]

  - id: fastapi-no-rate-limit
    pattern: |
      @app.$METHOD("$PATH")
    message: "Endpoint without explicit rate limiting — consider adding @rate_limit decorator."
    severity: WARNING
    languages: [python]

  # ── PII / Data Privacy ──────────────────────────────────────────────────
  - id: python-logging-pii
    pattern: |
      logger.$LEVEL(f"...{email}...")
    message: "PII (email address) in log — mask or omit personally identifiable information."
    severity: WARNING
    languages: [python]

  - id: python-logging-phone
    pattern: |
      logger.$LEVEL(f"...{phone}...")
    message: "PII (phone number) in log — mask or omit."
    severity: WARNING
    languages: [python]

  # ── Dependency / Import Safety ──────────────────────────────────────────
  - id: python-import-unverified
    pattern: |
      pip install $PACKAGE
    message: "Installing unverified packages — pin versions and use checksum verification."
    severity: WARNING
    languages: [generic]

  # ── Configuration Security ──────────────────────────────────────────────
  - id: python-default-secret
    pattern: |
      SECRET_KEY = "default"
    message: "Default secret key — change in production to a securely generated value."
    severity: ERROR
    languages: [python]
