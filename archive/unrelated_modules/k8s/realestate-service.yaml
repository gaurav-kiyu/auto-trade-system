# Real Estate Platform — Services, Ingress, and Network Policies
# ─────────────────────────────────────────────────────────────────────────────

---
# ── API Service (Cluster-internal) ──────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: realestate-api
  namespace: realestate
  labels:
    app: realestate
    tier: api
spec:
  selector:
    app: realestate
    tier: api
  ports:
    - name: http
      port: 8765
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  type: ClusterIP

---
# ── Postgres Service ────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: realestate-postgres
  namespace: realestate
  labels:
    app: realestate
    tier: database
spec:
  selector:
    app: realestate
    tier: database
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  clusterIP: None  # Headless for StatefulSet

---
# ── Redis Service ───────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: realestate-redis
  namespace: realestate
  labels:
    app: realestate
    tier: cache
spec:
  selector:
    app: realestate
    tier: cache
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
  clusterIP: None  # Headless for StatefulSet

---
# ── Ingress ─────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: realestate-ingress
  namespace: realestate
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "90"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/limit-rps: "30"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "2"
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - realestate.example.com
      secretName: realestate-tls
  rules:
    - host: realestate.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: realestate-api
                port:
                  number: 8765

---
# ── Network Policy ──────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: realestate-api-policy
  namespace: realestate
spec:
  podSelector:
    matchLabels:
      app: realestate
      tier: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app: realestate
              tier: worker
      ports:
        - port: 8765
        - port: 9090
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: realestate
              tier: database
        - podSelector:
            matchLabels:
              app: realestate
              tier: cache
      ports:
        - port: 5432
        - port: 6379
    - to:
        - namespaceSelector: {}
      ports:
        - port: 443
        - port: 80
