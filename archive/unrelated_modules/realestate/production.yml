# Real Estate Platform — Production Docker Compose override
# Usage: docker compose -f docker-compose.yml -f realestate/production.yml up -d

version: "3.9"

services:
  # ── PostgreSQL Database ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: realestate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: realestate
      POSTGRES_USER: realestate_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./realestate/infrastructure/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realestate_user -d realestate"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - realestate-network

  # ── Redis Cache & Session Store ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: realestate-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis-change-me}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - realestate-network

  # ── Real Estate API ─────────────────────────────────────────────────────────
  realestate-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: realestate-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://realestate_user:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/realestate
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis-change-me}@redis:6379/0
      # Real Estate Config
      REAL_ESTATE_ENABLED: "true"
      UPLOAD_STORAGE: ${UPLOAD_STORAGE:-local}
      UPLOAD_MAX_SIZE_MB: "10"
      # OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRY_HOURS: "24"
      ADMIN_EMAILS: ${ADMIN_EMAILS:-admin@realestate.in}
      # Email
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: "587"
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@realestate.example.com}
      # S3/Cloud Storage
      AWS_BUCKET: ${AWS_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
    volumes:
      - upload_data:/app/uploads
    ports:
      - "8765:8765"
    networks:
      - realestate-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: realestate-nginx
    restart: unless-stopped
    depends_on:
      - realestate-api
    volumes:
      - ./realestate/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./realestate/static/:/usr/share/nginx/html/static/:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - realestate-network

  # ── Background Worker (Optional) ────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: realestate-worker
    restart: unless-stopped
    command: python -m realestate.worker
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://realestate_user:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/realestate
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis-change-me}@redis:6379/0
    networks:
      - realestate-network

networks:
  realestate-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  upload_data:
