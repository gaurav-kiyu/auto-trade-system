# Real Estate Platform — Nginx Reverse Proxy Configuration
# Proxies to FastAPI backend on port 8765

upstream realestate_api {
    server realestate-api:8765;
    keepalive 64;
}

server {
    listen 80;
    server_name realestate.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name realestate.example.com;

    # ── SSL (configure with certbot or mounted certs) ──────────────────────
    ssl_certificate     /etc/ssl/certs/fullchain.pem;
    ssl_certificate_key /etc/ssl/private/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Security Headers ───────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://accounts.google.com; font-src 'self' data:; connect-src 'self' https: wss:; frame-src https://accounts.google.com;" always;

    # ── Static Files ───────────────────────────────────────────────────────
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── Sitemap / Robots ───────────────────────────────────────────────────
    location /sitemap.xml {
        proxy_pass http://realestate_api;
        proxy_set_header Host $host;
    }

    location /robots.txt {
        proxy_pass http://realestate_api;
        proxy_set_header Host $host;
    }

    # ── API Proxy ──────────────────────────────────────────────────────────
    location / {
        proxy_pass http://realestate_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Rate Limiting ──────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://realestate_api;
    }

    # ── Logging ────────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ── Large Uploads (property photos) ────────────────────────────────────
    client_max_body_size 20M;
}
