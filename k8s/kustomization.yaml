apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: opb-trading

# Production safety: this trading workload is intentionally single-active.
# Do not enable canary/HPA until distributed execution locking/idempotency is
# independently validated for the target broker/execution provider.
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - pvc.yaml
  - secret.yaml

generatorOptions:
  disableNameSuffixHash: true

commonLabels:
  app.kubernetes.io/name: opb-index-options-bot
  app.kubernetes.io/component: trading-platform
  app.kubernetes.io/version: "2.59.0"
