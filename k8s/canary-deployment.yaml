---
# OPB Bot — Kubernetes Canary Deployment
# ─────────────────────────────────────────────────────────────────────────────
# Canary variant for rolling out DatabaseProvider PostgreSQL mode with
# reduced traffic exposure. Runs alongside the stable deployment; the
# existing opb-service routes traffic to both canary and stable pods.
#
# To test DatabaseProvider PostgreSQL mode, set env:
#   DB_PROVIDER=postgresql
#   pg_host=<postgres-host>
#   pg_dbname=opb_trades
#
# Gradual rollout:
#   1. Deploy canary → monitor metrics & health
#   2. If healthy for N minutes, promote to stable via label update
#   3. Scale down canary → 0
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opb-canary
  labels:
    app: opb-bot
    tier: trading
    track: canary
    version: v2.59.0-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opb-bot
      track: canary
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: opb-bot
        tier: trading
        track: canary
        version: v2.59.0-canary
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: opb-bot
          image: opb-bot:2.59.0-canary
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: dashboard
              containerPort: 8765
              protocol: TCP
          envFrom:
            - configMapRef:
                name: opb-config
            - secretRef:
                name: opb-secrets
                optional: true
          env:
            - name: DB_PROVIDER
              value: "sqlite"  # Override to "postgresql" when PostgreSQL is available
            - name: OPBUYING_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: opb-secrets
                  key: bot-token
                  optional: true
            - name: OPBUYING_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: opb-secrets
                  key: chat-id
                  optional: true
            - name: OPBUYING_KITE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: opb-secrets
                  key: kite-api-key
                  optional: true
            - name: OPBUYING_KITE_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: opb-secrets
                  key: kite-access-token
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data/db
              subPath: db
            - name: data
              mountPath: /data/models
              subPath: models
            - name: data
              mountPath: /data/reports
              subPath: reports
            - name: data
              mountPath: /data/logs
              subPath: logs
          resources:
            requests:
              memory: "256Mi"    # Reduced for canary
              cpu: "125m"        # Reduced for canary
            limits:
              memory: "512Mi"    # Reduced for canary
              cpu: "250m"        # Reduced for canary
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - |
                  import sys
                  try:
                      from core.db_provider import get_database
                      db = get_database()
                      health = db.health_check()
                      sys.exit(0 if health.get("status") in ("healthy", "disconnected") else 1)
                  except Exception:
                      sys.exit(1)
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - |
                  import sys
                  try:
                      from core.db_provider import get_database
                      db = get_database()
                      stats = db.get_stats()
                      if stats.get("connected", False) or stats.get("queries", 0) >= 0:
                          sys.exit(0)
                  except Exception:
                      pass
                  sys.exit(1)
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            exec:
              command:
                - python
                - -c
                - |
                  import sys
                  modules = [
                      'core.db_provider',
                      'core.metrics_exporter',
                      'core.safety_state',
                      'core.health_checker',
                  ]
                  for m in modules:
                      try:
                          __import__(m)
                      except Exception:
                          sys.exit(1)
                  sys.exit(0)
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: opb-data-pvc
            readOnly: false
