name: Real Estate Platform CI/CD

on:
  push:
    branches: [main, develop, release/**]
    paths: ['realestate/**', 'tests/test_realestate*.py', 'templates/realestate/**', 'e2e/**', 'k8s/realestate-*', 'scripts/launch_realestate.py', '.github/workflows/realestate-*']
  pull_request:
    branches: [main, develop]
    paths: ['realestate/**', 'tests/test_realestate*.py', 'templates/realestate/**', 'e2e/**']

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      - name: Ruff check (realestate)
        run: |
          ruff check realestate/ --statistics

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install -e ".[dev,broker,dashboard,monitoring,ml]"
          pip install -r requirements-dev.txt
      - name: Materialize config.json (gitignored; required by config loader)
        run: cp json/config.template.json json/config.json
      - name: Run real estate unit tests
        run: |
          python -m pytest tests/test_realestate.py tests/test_realestate_fraud.py tests/test_realestate_monitoring.py tests/test_realestate_webhooks.py tests/test_realestate_scheduler.py tests/test_realestate_seo.py tests/test_realestate_auth.py tests/test_realestate_production.py tests/test_realestate_rera.py tests/test_realestate_cache.py tests/test_realestate_analytics.py tests/test_realestate_notifications.py tests/test_realestate_modules.py tests/test_realestate_export.py tests/test_realestate_startup.py -q --tb=short --timeout=180

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install -e ".[dev,broker,dashboard,monitoring,ml]" coverage
          pip install -r requirements-dev.txt
      - name: Materialize config.json (gitignored; required by config loader)
        run: cp json/config.template.json json/config.json
      - name: Run coverage
        run: |
          mkdir -p reports
          python -m coverage run --source=realestate -m pytest tests/test_realestate_fraud.py tests/test_realestate_startup.py -q --tb=short --timeout=120
          python -m coverage report --fail-under=40 --show-missing
          python -m coverage xml -o reports/coverage-realestate.xml --fail-under=40
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: realestate-coverage-report
          path: reports/coverage-realestate.xml

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install semgrep bandit pip-audit
      - name: Semgrep scan (realestate)
        run: |
          mkdir -p reports
          semgrep --config=.semgrep.yaml realestate/ --json -o reports/semgrep-realestate.json || echo "Semgrep warnings found — review before release"
      - name: Bandit scan
        run: |
          bandit -r realestate/ -f json -o reports/bandit-realestate.json || echo "Bandit warnings found"
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: realestate-security-reports
          path: reports/semgrep-realestate.json

  deployment-check:
    name: Deployment Verification
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install -e ".[dev,broker,dashboard,monitoring,ml]"
          pip install -r requirements-dev.txt
      - name: Materialize config.json (gitignored; required by config loader)
        run: cp json/config.template.json json/config.json
      - name: Verify startup imports
        run: |
          python - <<'PYEOF'
          from realestate.startup import startup_realestate_system
          result = startup_realestate_system()
          assert result['realestate_platform']['status'] == 'ok', f'Startup failed: {result}'
          print(f'[OK] Startup verified — {len(result)} modules initialized')
          for key, val in sorted(result.items()):
              if key != '_service_instances':
                  print(f'  {key}: {val}')
          PYEOF
      - name: Verify seed data
        run: |
          python - <<'PYEOF'
          from realestate.application.services import create_default_services
          from realestate.seed_data import seed_properties
          svcs = create_default_services()
          props = seed_properties(svcs['property_service'])
          print(f'[OK] {props} seed properties created')
          PYEOF
      - name: Verify API imports
        run: |
          python - <<'PYEOF'
          from realestate.api import wire_realestate_api
          from realestate.application.services import create_default_services
          svcs = create_default_services()
          print(f'[OK] API wiring imports OK — {len(svcs)} services')
          for name in svcs:
              print(f'  Service: {name}')
          PYEOF

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install -e ".[dev,broker,dashboard,monitoring,ml]"
          npx playwright install --with-deps chromium
      - name: Start server
        run: |
          python scripts/launch_realestate.py --port 8765 --no-scheduler &
          # Wait for server with retry loop
          for i in $(seq 1 10); do
            curl -sf http://localhost:8765/api/realestate/health > /dev/null 2>&1 && break
            echo "Waiting for server... ($i/10)"
            sleep 3
          done
          curl -f http://localhost:8765/api/realestate/health || echo "Server not ready yet"
      - name: Run E2E tests
        run: |
          npx playwright test e2e/realestate-flows.spec.js --project=chromium --timeout=30000 || echo "E2E tests had some failures — review before release"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [test, coverage, security, lint, deployment-check]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build -t realestate-platform:latest -f Dockerfile .
      - name: Deploy to staging
        run: |
          echo "Deployment step — customize for your environment"
          echo "Example: kubectl set image deployment/realestate-api realestate-api=realestate-platform:latest"
