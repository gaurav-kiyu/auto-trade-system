<!-- ══════════════════════════════════════════════════════════════════════════
  Mobile Bottom Navigation — included by authenticated dashboard templates
  ══════════════════════════════════════════════════════════════════════════ -->
<style>
  .mobile-bottom-nav {
    display: none !important;
  }
  @media (max-width: 768px) {
    .mobile-bottom-nav {
      display: block !important;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: var(--bg-card, #0f172a);
      border-top: 1px solid var(--border-color, #334155);
      z-index: 9999;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.3);
    }
    .mobile-bottom-nav .nav-items {
      display: flex;
      align-items: center;
      justify-content: space-around;
      height: 100%;
      padding: 0 0.5rem;
    }
    .mobile-bottom-nav .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted, #94a3b8);
      text-decoration: none;
      font-size: 0.65rem;
      font-weight: 600;
      gap: 2px;
    }
    .mobile-bottom-nav .nav-item.active {
      color: var(--accent-color, #38bdf8);
    }
    .mobile-bottom-nav .nav-item svg {
      width: 18px !important;
      height: 18px !important;
      max-width: 18px !important;
      max-height: 18px !important;
      display: block;
    }
  }
</style>
<div class="mobile-bottom-nav">
  <div class="nav-items">
    <a href="/" class="nav-item{% if current_page == 'dashboard' %} active{% endif %}">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
      <span>Dashboard</span>
    </a>
    <a href="/performance" class="nav-item{% if current_page == 'performance' %} active{% endif %}">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
      <span>Perf</span>
    </a>
    <a href="/trade-journal" class="nav-item{% if current_page == 'trade_journal' %} active{% endif %}">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
      <span>Journal</span>
    </a>
    <a href="/metrics-trend" class="nav-item{% if current_page == 'metrics_trend' %} active{% endif %}">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
      <span>Trend</span>
    </a>
    <a href="/live-pnl" class="nav-item{% if current_page == 'live_pnl' %} active{% endif %}">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
      <span>PnL</span>
    </a>
  </div>
</div>
