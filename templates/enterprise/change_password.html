<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPB — Change Password</title>
    <script src="/static/vendor/tailwind.min.js" nonce="{{ nonce }}"></script>
    <script src="/static/theme_engine.js" nonce="{{ nonce }}"></script>
    <link rel="stylesheet" href="/static/fontawesome.min.css">
<style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-ui, 'Inter', sans-serif); background: var(--bg-primary, #080b10); color: var(--text-primary, #e2e8f0); min-height: 100vh; padding: 2rem; }
        h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem; }
        .card { background: var(--bg-card, linear-gradient(135deg, #1a1f2e 0%, #0f1319 100%)); border: 1px solid var(--border-color, #1e293b); border-radius: 0.75rem; padding: 2rem; max-width: 480px; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-field { width: 100%; padding: 0.6rem 2.5rem 0.6rem 0.8rem; background: #0f1319; border: 1px solid var(--border-color, #1e293b); border-radius: 0.35rem; color: var(--text-primary, #e2e8f0); font-size: 0.85rem; outline: none; }
        .input-field:focus { border-color: #3b82f6; }
label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted, #94a3b8); margin-bottom: 0.35rem; display: block; }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; padding: 0.5rem 1rem; border-radius: 0.35rem; font-size: 0.85rem; font-weight: 600; cursor: pointer; border: none; }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-ghost { background: transparent; color: var(--text-muted, #94a3b8); border: 1px solid var(--border-color, #1e293b); text-decoration: none; }
        .error-msg { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); border-radius: 0.35rem; padding: 0.75rem; color: var(--danger-color, #dc2626); font-size: 0.85rem; display: none; margin-bottom: 1rem; }
        .success-msg { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3); border-radius: 0.35rem; padding: 0.75rem; color: var(--success-color, #16a34a); font-size: 0.85rem; display: none; margin-bottom: 1rem; }
        .spinner { display: none; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>    {% include "_pwa_head.html" %}
    <!-- Fonts & Design System Tokens -->
    <link rel="stylesheet" href="/static/fontawesome.min.css">
<link rel="stylesheet" href="/static/opb_design_system.css">
    
</head>
<body>
    {% include '_nav.html' %}
    

    <h1><i class="fas fa-key" style="color:#3b82f6;margin-right:0.5rem;"></i> Change Password</h1>

    <div class="card">
        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>
        <form id="passwordForm" style="display:flex;flex-direction:column;gap:1rem;">
            <div>
                <label for="currentPassword"><i class="fas fa-lock"></i> Current Password</label>
                <div class="input-wrapper opb-password-wrapper">
                    <input type="password" id="currentPassword" class="input-field" required autocomplete="current-password">
                    <button type="button" class="opb-password-toggle" data-toggle="password" aria-label="Show password" title="Show/Hide password" tabindex="-1"><svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="eye-svg-open"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
                </div>
            </div>
            <div>
                <label for="newPassword"><i class="fas fa-lock"></i> New Password</label>
                <div class="input-wrapper opb-password-wrapper">
                    <input type="password" id="newPassword" class="input-field" required autocomplete="new-password" minlength="8">
                    <button type="button" class="opb-password-toggle" data-toggle="password" aria-label="Show password" title="Show/Hide password" tabindex="-1"><svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="eye-svg-open"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
                </div>
                <div style="font-size:0.75rem;color: var(--text-muted, #94a3b8);margin-top:0.25rem;">At least 8 characters</div>
            </div>
            <div>
                <label for="confirmPassword"><i class="fas fa-lock"></i> Confirm New Password</label>
                <div class="input-wrapper opb-password-wrapper">
                    <input type="password" id="confirmPassword" class="input-field" required autocomplete="new-password">
                    <button type="button" class="opb-password-toggle" data-toggle="password" aria-label="Show password" title="Show/Hide password" tabindex="-1"><svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="eye-svg-open"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
                </div>
            </div>
            <div style="display:flex;gap:0.75rem;">
                <button type="submit" class="btn btn-primary" id="changeBtn">
                    <span id="btnText">Change Password</span>
                    <span class="spinner" id="btnSpinner"></span>
                </button>
                <a href="/" class="btn btn-ghost">Cancel</a>
            </div>
        </form>
    </div>

    <script nonce="{{ nonce }}">
(name) {
            const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            return match ? decodeURIComponent(match[2]) : '';
        }

        // Wired via addEventListener, not inline onclick attributes - CSP's
        // script-src here has no 'unsafe-inline', which silently blocks inline
        // event-handler attributes even though this nonce'd block can still run.

        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAll();
            const current = document.getElementById('currentPassword').value;
            const newPass = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            if (!current || !newPass) { showError('All fields are required'); return; }
            if (newPass.length < 8) { showError('Password must be at least 8 characters'); return; }
            if (newPass !== confirm) { showError('Passwords do not match'); return; }
            setLoading(true);
            try {
                const res = await fetch('/api/auth/change-password', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json', 'X-CSRF-Token': getCookie('opb_csrf')},
                    credentials: 'include',
                    body: JSON.stringify({current_password: current, new_password: newPass}),
                });
                const data = await res.json();
                if (res.ok) {
                    showSuccess('Password changed successfully!');
                    document.getElementById('currentPassword').value = '';
                    document.getElementById('newPassword').value = '';
                    document.getElementById('confirmPassword').value = '';
                } else {
                    showError(data.detail || 'Failed to change password');
                }
            } catch(err) { showError('Error: ' + err.message); }
            setLoading(false);
        });
    </script>    {% include "_pwa_sw_reg.html" %}
</body>
</html>
