<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPB Enterprise — Set New Password</title>
    <link rel="stylesheet" href="/static/fontawesome.min.css">
<script src="/static/theme_engine.js?v=3.3" nonce="{{ nonce }}"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-ui, 'Inter', sans-serif);
            background-color: var(--bg-primary, #080c14);
            color: var(--text-primary, #f8fafc);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .ambient-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--header-glow, rgba(56, 189, 248, 0.15)) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .card {
            position: relative;
            z-index: 10;
            background: var(--bg-card, #131e33);
            border: 1px solid var(--border-color, #1e293b);
            border-radius: 1.25rem;
            padding: 2.5rem;
            width: 100%;
            max-width: 440px;
            box-shadow: var(--card-shadow, 0 25px 50px -12px rgba(0, 0, 0, 0.6));
            backdrop-filter: blur(16px);
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.35rem 0.75rem;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid var(--border-color, #1e293b);
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-color, #38bdf8);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 0.75rem;
        }

        .pulse-dot { width: 6px; height: 6px; background: var(--success-color, #22c55e); border-radius: 50%; }
        h1 { font-size: 1.65rem; font-weight: 800; text-align: center; margin-bottom: 0.25rem; color: var(--text-primary, #fff); }
        .subtitle { color: var(--text-muted, #94a3b8); font-size: 0.85rem; text-align: center; margin-bottom: 1.5rem; }

        .input-group { margin-bottom: 1.25rem; }
        .input-label { font-size: 0.8rem; font-weight: 600; color: var(--text-secondary, #cbd5e1); margin-bottom: 0.35rem; display: block; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-icon { position: absolute; left: 1rem; font-size: 0.9rem; color: var(--text-muted, #64748b); pointer-events: none; }
        .input-control {
            width: 100%;
            padding: 0.85rem 2.6rem 0.85rem 2.6rem;
            background-color: var(--input-bg, #0b1120);
            border: 1px solid var(--input-border, #1e293b);
            border-radius: 0.65rem;
            color: var(--text-primary, #ffffff);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }
        .input-control:focus { border-color: var(--accent-color, #38bdf8); box-shadow: 0 0 0 3px rgba(56,189,248,0.15); }
.btn-submit {
            width: 100%;
            padding: 0.95rem;
            background: var(--accent-gradient, linear-gradient(135deg, #0284c7 0%, #2563eb 100%));
            color: var(--text-primary, #ffffff);
            font-size: 0.95rem;
            font-weight: 700;
            border: none;
            border-radius: 0.65rem;
            cursor: pointer;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.25s ease;
        }
        .btn-submit:hover { transform: translateY(-2px); filter: brightness(1.05); }

        .error-box { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.25); border-radius: 0.5rem; padding: 0.75rem; color: var(--danger-color, #dc2626); font-size: 0.85rem; display: none; margin-bottom: 1rem; }
        .success-box { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.25); border-radius: 0.5rem; padding: 0.75rem; color: var(--success-color, #16a34a); font-size: 0.85rem; display: none; margin-bottom: 1rem; }
        .footer { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border-color, #1e293b); text-align: center; font-size: 0.85rem; color: var(--text-muted, #94a3b8); }
        .footer a { color: var(--accent-color, #38bdf8); text-decoration: none; font-weight: 700; }
        .spinner { display: none; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>    {% include "_pwa_head.html" %}
    <!-- Fonts & Design System Tokens -->
    <link rel="stylesheet" href="/static/fontawesome.min.css">
<link rel="stylesheet" href="/static/opb_design_system.css">
    
</head>
<body>
    <div class="ambient-glow"></div>

    <div class="card">
        <div style="text-align:center;">
            <div class="brand-badge">
                <span class="pulse-dot"></span>
                <span>SECURE RESET PORTAL</span>
            </div>
            <h1>Set New Password</h1>
            <p class="subtitle" id="resetSubtitle">Enter and confirm your new secure password</p>
        </div>

        <div class="error-box" id="errorBox"></div>
        <div class="success-box" id="successBox"></div>

        <form id="resetForm">
            <input type="hidden" id="resetToken" value="{{ token }}">
            
            <div class="input-group">
                <label class="input-label" for="newPassword">New Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <div class="opb-password-wrapper"><input type="password" id="newPassword" class="input-control" placeholder="Minimum 8 characters" required minlength="8"><button type="button" class="opb-password-toggle" data-toggle="password" aria-label="Show password" title="Show/Hide password" tabindex="-1"><svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="eye-svg-open"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></div>

                </div>
            </div>

            <div class="input-group">
                <label class="input-label" for="confirmPassword">Confirm Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <div class="opb-password-wrapper"><input type="password" id="confirmPassword" class="input-control" placeholder="Re-enter new password" required minlength="8"><button type="button" class="opb-password-toggle" data-toggle="password" aria-label="Show password" title="Show/Hide password" tabindex="-1"><svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="eye-svg-open"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></div>

                </div>
            </div>

            <button type="submit" class="btn-submit" id="btnSubmit">
                <span id="btnText">Update Password</span>
                <span class="spinner" id="spinner"></span>
            </button>
        </form>

        <div class="footer">
            Back to <a href="/login">Sign In</a>
        </div>
    </div>

    <script nonce="{{ nonce }}">
        async function verifyTokenOnLoad() {
            const token = document.getElementById('resetToken').value.trim();
            if (!token) {
                document.getElementById('errorBox').textContent = 'Missing or invalid reset token. Please request a new link.';
                document.getElementById('errorBox').style.display = 'block';
                document.getElementById('resetForm').style.display = 'none';
                return;
            }
            try {
                const res = await fetch('/api/auth/verify-reset-token', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({token})
                });
                const data = await res.json();
                if (res.ok) {
                    document.getElementById('resetSubtitle').textContent = `Resetting password for user: ${data.username}`;
                } else {
                    document.getElementById('errorBox').textContent = data.detail || 'Reset token has expired or is invalid.';
                    document.getElementById('errorBox').style.display = 'block';
                    document.getElementById('resetForm').style.display = 'none';
                }
            } catch(e) {}
        }
        verifyTokenOnLoad();

        async function handlePasswordReset(e) {
            e.preventDefault();
            const token = document.getElementById('resetToken').value.trim();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errEl = document.getElementById('errorBox');
            const succEl = document.getElementById('successBox');
            const btn = document.getElementById('btnSubmit');
            const txt = document.getElementById('btnText');
            const spin = document.getElementById('spinner');

            errEl.style.display = 'none';
            succEl.style.display = 'none';

            if (newPassword !== confirmPassword) {
                const msg = 'Passwords do not match.';
                errEl.textContent = msg;
                errEl.style.display = 'block';
                if (window.showError) window.showError(msg, 'Validation Error');
                return;
            }
            if (newPassword.length < 8) {
                const msg = 'Password must be at least 8 characters.';
                errEl.textContent = msg;
                errEl.style.display = 'block';
                if (window.showError) window.showError(msg, 'Validation Error');
                return;
            }

            btn.disabled = true;
            txt.style.display = 'none';
            spin.style.display = 'inline-block';

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({token, new_password: newPassword})
                });
                const data = await res.json();
                if (res.ok) {
                    succEl.textContent = 'Password reset successfully! Redirecting to login...';
                    succEl.style.display = 'block';
                    if (window.showSuccess) window.showSuccess('Password reset successfully! Redirecting...', 'Success');
                    document.getElementById('resetForm').style.display = 'none';
                    setTimeout(() => { window.location.href = '/login'; }, 2000);
                } else {
                    const msg = data.detail || 'Password reset failed.';
                    errEl.textContent = msg;
                    errEl.style.display = 'block';
                    if (window.showError) window.showError(msg, 'Reset Failed');
                }
            } catch(err) {
                errEl.textContent = 'Network error. Please try again.';
                errEl.style.display = 'block';
                if (window.showError) window.showError('Network error. Please try again.', 'Connection Error');
            } finally {
                btn.disabled = false;
                txt.style.display = 'inline';
                spin.style.display = 'none';
            }
        }
    </script>    {% include "_pwa_sw_reg.html" %}
    <script nonce="{{ nonce }}">
        // Wired via addEventListener, not inline attributes - CSP's script-src
        // has no 'unsafe-inline', which silently blocks inline event-handler
        // attributes even though a nonce'd block itself can still run (2026-08-22 fix).
        document.getElementById('resetForm')?.addEventListener('submit', function(event) { handlePasswordReset(event) });
    </script>
</body>
</html>
